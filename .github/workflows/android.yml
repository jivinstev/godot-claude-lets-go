name: Android APK

# A debug APK, published as a GitHub Release with a direct download link. Builds when:
#   1. a pushed commit's message contains [apk]   — any branch. This is how you (or Claude) ask
#      for a build: `git commit --allow-empty -m "[apk] build for phone testing"`.
#   2. a pull request is merged into main          — automatic, so main always has a fresh build.
#   3. you press Actions → Android APK → Run workflow.
# Every other push starts a run that skips in seconds (no minutes spent building).
#
# Releases are tagged apk-pr-<N> (merges) and apk-<run> (everything else); the last 5 and 10 are
# kept and older ones deleted. No run artifact is uploaded — it would duplicate the Release and
# fill the Actions storage quota. Watch → Custom → Releases to get each link by email.
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    types: [closed]

permissions:
  contents: write   # lets GITHUB_TOKEN publish the Release

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[apk]')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK: ${{ github.event.repository.name }}.apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
      - name: Read the engine version
        run: |
          V="$(tr -d '[:space:]' < godot-version)"
          echo "GODOT_VERSION=$V" >> "$GITHUB_ENV"
          echo "TPL_DIR=$HOME/.local/share/godot/export_templates/${V/-/.}" >> "$GITHUB_ENV"
          echo "ES_VER=$(echo "$V" | cut -d- -f1 | cut -d. -f1,2)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" "platforms;android-35" >/dev/null
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android
      - name: Install Godot + export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin "$TPL_DIR"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -oq /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot && chmod +x ~/godot-bin/godot
          curl -fsSL -o /tmp/tpl.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl && cp /tmp/tpl/templates/* "$TPL_DIR/"
      - name: Point Godot at the SDK, JDK and debug keystore
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${ES_VER}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
      - name: Export the debug APK
        run: |
          ~/godot-bin/godot --headless --path . --import >/dev/null 2>&1 || true
          ~/godot-bin/godot --headless --path . --export-debug "Android" "$GITHUB_WORKSPACE/$APK"
          ls -la "$APK"
      - name: Publish a Release with a direct link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LABEL="main · PR #${{ github.event.pull_request.number }}"; TARGET="${{ github.event.pull_request.merge_commit_sha }}"
            TAG="apk-pr-${{ github.event.pull_request.number }}"
          else
            LABEL="${{ github.ref_name }}"; TARGET="${{ github.sha }}"; TAG="apk-${{ github.run_number }}"
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" --prerelease --target "$TARGET" \
            --title "APK · ${LABEL} · #${{ github.run_number }}" \
            --notes "$(printf '**Direct download:** %s\n\nDebug APK — %s\n\n_%s_' "$URL" "$LABEL" "$(git log -1 --pretty=%s)")"
          echo "## APK ready: [$APK]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $URL"
      - name: Prune old builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prune() {
            gh release list --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
              | grep -E "$1" | tail -n +"$(( $2 + 1 ))" | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done || true
          }
          prune '^apk-pr-' 5
          prune '^apk-[0-9]' 10
